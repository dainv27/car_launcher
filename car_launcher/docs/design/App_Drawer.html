<script>
    // Simple Interaction Feedback for Automotive UI
    document.querySelectorAll('button').forEach(button => {
        button.addEventListener('touchstart', () => {
            button.classList.add('opacity-70');
        });
        button.addEventListener('touchend', () => {
            button.classList.remove('opacity-70');
        });
    });

    // Search Filter Simulation
    const searchInput = document.querySelector('input');
    const appGridItems = document.querySelectorAll('.app-grid > button');

    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        appGridItems.forEach(item => {
            const label = item.querySelector('span:last-child').textContent.toLowerCase();
            if (label.includes(query)) {
                item.style.display = 'flex';
            } else {
                item.style.display = 'none';
            }
        });
    });

    // Micro-interaction: Update digital clock
    function updateClock() {
        const now = new Date();
        const timeSpan = document.querySelector('.font-headline-md');
        if (timeSpan) {
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            timeSpan.textContent = `${hours}:${minutes}`;
        }
    }
    setInterval(updateClock, 1000);
    updateClock();
</script>
