            box-shadow: 0 0 15px #00E5FF;

        /* Custom range styling for sliders */

            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #00E5FF;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.6);

<body class="bg-deep-obsidian text-on-surface select-none">

        <div class="flex gap-2 mt-1">

            <span class="material-symbols-outlined text-neon-cyan text-[18px]">bluetooth</span>
        </div>
    </div>
    <!-- Main Navigation Links -->
    <div class="flex-1 flex flex-col w-full gap-2">
        <button class="flex items-center justify-center w-full h-16 text-on-surface-variant hover:bg-glass-surface transition-colors duration-200">
            <span class="material-symbols-outlined text-[32px]">home</span>
        </button>
        <button class="flex items-center justify-center w-full h-16 text-on-surface-variant hover:bg-glass-surface transition-colors duration-200">
            <span class="material-symbols-outlined text-[32px]">arrow_back</span>
        </button>
        <button class="flex items-center justify-center w-full h-16 text-on-surface-variant hover:bg-glass-surface transition-colors duration-200">
            <span class="material-symbols-outlined text-[32px]">apps</span>
        </button>
        <!-- Active Navigation: Music -->
        <button class="relative flex items-center justify-center w-full h-16 text-neon-cyan before:absolute before:left-0 before:w-1 before:h-8 before:bg-neon-cyan before:shadow-[0_0_15px_#00E5FF] active:scale-95 transition-transform duration-150">

        </button>
        <button class="flex items-center justify-center w-full h-16 text-on-surface-variant hover:bg-glass-surface transition-colors duration-200">
            <span class="material-symbols-outlined text-[32px]">explore</span>
        </button>
        <button class="flex items-center justify-center w-full h-16 text-on-surface-variant hover:bg-glass-surface transition-colors duration-200">
            <span class="material-symbols-outlined text-[32px]">grid_view</span>
        </button>
        <button class="flex items-center justify-center w-full h-16 text-on-surface-variant hover:bg-glass-surface transition-colors duration-200">

<!-- Top AppBar Integration -->
<header class="absolute top-0 right-0 w-[calc(100%-120px)] h-20 flex justify-between items-center px-gutter ml-[120px] bg-transparent z-40">
    <h1 class="font-headline-lg text-headline-lg font-bold text-safety-white tracking-tight">K3</h1>
    <div class="flex gap-6 items-center">
        <button class="text-on-surface-variant hover:text-neon-cyan active:opacity-80 transition-all">
            <span class="material-symbols-outlined text-[28px]">notifications</span>
        </button>
        <button class="text-on-surface-variant hover:text-neon-cyan active:opacity-80 transition-all">
            <span class="material-symbols-outlined text-[28px]">mic</span>
        </button>
    </div>
</header>
<!-- Main Content Area (1800px width) -->
<main class="ml-[120px] pt-20 h-full flex items-center justify-center px-gutter">
    <div class="w-full max-w-[1700px] grid grid-cols-12 gap-gutter h-[580px]">
        <!-- Left Section: Album Art (Col 1-5) -->
        <div class="col-span-5 flex items-center justify-center">
            <div class="relative w-[500px] h-[500px] rounded-xl overflow-hidden glass-card group">
                <img alt="Now Playing Cover" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" data-alt="A cinematic, high-fidelity album cover for a synthwave music track. The artwork features a futuristic sports car driving through a neon-lit cyberpunk city at night with purple and cyan streaks of light. The visual style is sleek and technical, echoing a premium automotive glassmorphic interface with high-contrast shadows and glowing electric highlights." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC5m8D1TPL4ybMfPwLeK_eMlSNWyLZvYF3fU2gFKTOyN9F4Tuc0fY89y6jgbwfnw9M0WE0ERIQ2a_zjdDO7XuUNl8sZx5rsAS3SZKLLEoV2ZzDGez7nMffKvhOBr7335RUu2FZRjMWs69mEnldZg2UFXQI0T-s0uPu6O8zX_hCm-CGLTjqIGTbkiiItQu5bKmK5P9sfLQbFSFpsF7u3rtA-VyIK93w4xXY1wBxrUaNl8kux2jBZ55FtPUA7BgWm23jsBDTc2w7rc73R">
                <div class="absolute inset-0 bg-gradient-to-t from-deep-obsidian/60 to-transparent"></div>
                <!-- Playback State Indicator Overlay (Subtle) -->
                <div class="absolute bottom-6 right-6 flex items-center gap-2 px-4 py-2 bg-neon-cyan/20 backdrop-blur-md rounded-full border border-neon-cyan/30">
<span class="flex gap-1">
<span class="w-1 h-3 bg-neon-cyan animate-pulse"></span>
<span class="w-1 h-4 bg-neon-cyan animate-pulse delay-75"></span>
<span class="w-1 h-2 bg-neon-cyan animate-pulse delay-150"></span>
</span>
                    <span class="font-label-md text-label-md text-neon-cyan uppercase tracking-widest">Dolby Atmos</span>
                </div>
            </div>
        </div>
        <!-- Right Section: Controls & Info (Col 6-12) -->
        <div class="col-span-7 flex flex-col justify-center gap-8 pl-8">
            <!-- Metadata Area -->
            <div class="flex flex-col gap-2">
                <span class="text-neon-cyan font-label-lg text-label-lg tracking-widest uppercase">Currently Streaming</span>
                <h2 class="font-headline-lg text-[64px] leading-tight font-bold text-safety-white">Midnight Horizon</h2>
                <p class="font-body-lg text-headline-md text-on-surface-variant">Lumia Neon • Synthetic Dreams (2024)</p>
            </div>
            <!-- Progress Bar Area -->
            <div class="flex flex-col gap-4">
                <div class="relative w-full h-3 bg-white/10 rounded-full overflow-hidden">
                    <div class="absolute top-0 left-0 h-full w-[45%] bg-neon-cyan shadow-[0_0_15px_#00E5FF]"></div>
                </div>
                <div class="flex justify-between text-on-surface-variant font-label-md text-label-md">

                    <span class="">04:52</span>
                </div>
            </div>
            <!-- Playback Controls Cluster -->
            <div class="flex items-center gap-12 mt-4">
                <!-- Shuffle -->
                <button class="text-on-surface-variant hover:text-neon-cyan transition-colors">
                    <span class="material-symbols-outlined text-[36px]">shuffle</span>

                <!-- Previous -->

                    <span class="material-symbols-outlined text-[48px]">skip_previous</span>
                </button>
                <!-- Play/Pause (The Primary Hero) -->
                <button class="h-24 w-24 rounded-full bg-neon-cyan text-deep-obsidian flex items-center justify-center glow-cyan hover:scale-105 active:scale-95 transition-all" id="playBtn">
                    <span class="material-symbols-outlined text-[56px]" style="font-variation-settings: 'FILL' 1;">pause</span>
                </button>
                <!-- Next -->
                <button class="text-safety-white active:scale-90 transition-transform h-touch-target-min w-touch-target-min flex items-center justify-center rounded-full hover:bg-white/5">
                    <span class="material-symbols-outlined text-[48px]">skip_next</span>
                </button>
                <!-- Repeat -->
                <button class="text-neon-cyan transition-colors">
                    <span class="material-symbols-outlined text-[36px]">repeat_one</span>
                </button>
            </div>
            <!-- Volume & Extra Actions -->
            <div class="flex items-center gap-10 mt-8 glass-card p-6 rounded-xl border border-white/5">
                <div class="flex items-center gap-6 flex-1">
                    <span class="material-symbols-outlined text-on-surface-variant text-[28px]">volume_up</span>
                    <input class="w-full cursor-pointer accent-neon-cyan" type="range" value="65">
                </div>
                <div class="h-10 w-px bg-white/10 mx-2"></div>
                <div class="flex gap-8">
                    <button class="flex items-center gap-3 text-on-surface-variant hover:text-safety-white transition-colors">
                        <span class="material-symbols-outlined text-[28px]">favorite</span>
                        <span class="font-label-md text-label-md">Save</span>
                    </button>
                    <button class="flex items-center gap-3 text-on-surface-variant hover:text-safety-white transition-colors">
                        <span class="material-symbols-outlined text-[28px]">playlist_add</span>
                        <span class="font-label-md text-label-md">Add to Queue</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>
<!-- Background Atmospheric Effect -->
<div class="fixed inset-0 -z-10 pointer-events-none">
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-neon-cyan/5 blur-[120px] rounded-full"></div>
</div>
<script>
    // Simple micro-interaction for the play/pause button
    const playBtn = document.getElementById('playBtn');
    let isPlaying = true;

    playBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        const icon = playBtn.querySelector('.material-symbols-outlined');
        icon.textContent = isPlaying ? 'pause' : 'play_arrow';

        if (isPlaying) {
            playBtn.classList.add('glow-cyan');
        } else {
            playBtn.classList.remove('glow-cyan');
        }
    });

    // Volume slider simulation
    const rangeInputs = document.querySelectorAll('input[type="range"]');
    rangeInputs.forEach(input => {
        input.addEventListener('input', (e) => {
            const value = (e.target.value - e.target.min) / (e.target.max - e.target.min) * 100;
            e.target.style.background = `linear-gradient(to right, #00E5FF 0%, #00E5FF ${value}%, rgba(255,255,255,0.1) ${value}%, rgba(255,255,255,0.1) 100%)`;
        });
        // Trigger once for initial state
        input.dispatchEvent(new Event('input'));
    });
</script>
